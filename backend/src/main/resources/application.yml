# Configuration commune. Les valeurs sensibles viennent toujours de l'environnement.
# En local, le fichier .env à la racine du projet (ou dans backend/) est chargé s'il existe.
# La configuration propre à la production est dans application-prod.yml.
spring:
  application:
    name: nidaldeco-backend
  config:
    import:
      - "optional:file:../.env[.properties]"
      - "optional:file:.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:nidaldeco}}
    username: ${DB_USERNAME:nidaldeco}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: ${MEDIA_MAX_FILE_SIZE:8MB}
      max-request-size: ${MEDIA_MAX_REQUEST_SIZE:10MB}

server:
  # PORT est la variable fournie par la plupart des hébergeurs de conteneurs.
  port: ${SERVER_PORT:${PORT:8080}}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        name: NDSESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

# Actuator : uniquement l'état de santé, sans aucun détail. Rien d'autre n'est exposé
# (ni env, ni beans, ni configprops, ni heapdump, ni logfile…).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

app:
  # URL publique du site (sans slash final). Sert au sitemap, à robots.txt et à Open Graph.
  public-base-url: ${APP_PUBLIC_BASE_URL:}
  cors:
    # Origines autorisées, séparées par des virgules. Vide = même origine uniquement.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  media:
    # filesystem (disque local) ou s3 (stockage objet compatible S3).
    storage: ${APP_MEDIA_STORAGE:filesystem}
    storage-dir: ${MEDIA_STORAGE_DIR:../data/media}
    max-file-size: ${MEDIA_MAX_FILE_SIZE:8MB}
    s3:
      endpoint: ${S3_ENDPOINT:}
      # Pas de valeur par défaut : c'est la région indiquée par le fournisseur (Supabase : région du projet).
      region: ${S3_REGION:}
      bucket: ${S3_BUCKET:}
      access-key-id: ${S3_ACCESS_KEY_ID:}
      secret-access-key: ${S3_SECRET_ACCESS_KEY:}
      public-base-url: ${S3_PUBLIC_BASE_URL:}
  security:
    login-max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    login-window: ${LOGIN_WINDOW:15m}
    contact-max-per-window: ${CONTACT_MAX_PER_WINDOW:5}
    contact-window: ${CONTACT_WINDOW:10m}
  frontend:
    # Dossier du build React. Vide = le backend ne sert que l'API (développement avec Vite).
    dist-dir: ${FRONTEND_DIST_DIR:}
  admin-cli:
    email: ${BOOTSTRAP_ADMIN_EMAIL:${ADMIN_RESET_EMAIL:}}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:${ADMIN_RESET_PASSWORD:}}

---
# Commandes ponctuelles : pas de serveur web, l'application s'arrête après exécution.
spring:
  config:
    activate:
      on-profile: "bootstrap-admin | reset-admin-password"
  main:
    web-application-type: none
    banner-mode: "off"
